<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1015" />
    <title>Power Converter Studio — Magnetics, Control &amp; CAD</title>
    <meta name="description" content="Precision electrical power engineering workbench for Phase-Shifted Full-Bridge (PSFB), LLC Resonant, Dual-Active Bridge (DAB), and AC-DC PFC converters, including iGSE/Dowell high-frequency magnetics, nonlinear Coss ZVS analysis, electro-thermal semiconductor modeling, and small-signal Bode stability." />
    <meta property="og:title" content="Power Converter Studio — Magnetics, Control &amp; CAD" />
    <meta property="og:description" content="Precision electrical power engineering workbench for PSFB, LLC, DAB, and AC-DC PFC converters with iGSE magnetics, thermal derating, SPICE/QSPICE/PLECS export, and small-signal Bode stability." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M17.5 6L9 17.5h6.5L14.5 26 23 14.5h-6.5L17.5 6z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('pe-studio-theme-mode') || 'auto';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode !== 'light' && sysDark);
          document.documentElement.classList.toggle('dark', isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0e1015' : '#f6f7f9');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .pe-boot-shell {
        min-height: 100dvh;
        background: #f6f7f9;
        color: #111318;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        flex-direction: column;
      }
      html.dark .pe-boot-shell {
        background: #0e1015;
        color: #eef0f6;
      }
      .pe-boot-bar {
        height: 52px;
        padding: 0 20px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      html.dark .pe-boot-bar {
        background: #14171f;
        border-bottom-color: rgba(238, 240, 246, 0.08);
      }
      .pe-boot-progress {
        height: 2px;
        width: 100%;
        background: rgba(37, 99, 235, 0.14);
        overflow: hidden;
        position: relative;
      }
      .pe-boot-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 38%;
        background: #2563eb;
        animation: pe-slide 1.1s ease-in-out infinite;
      }
      @keyframes pe-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .pe-boot-body {
        max-width: 1640px;
        width: 100%;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        gap: 12px;
      }
      .pe-boot-kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
      }
      .pe-boot-card {
        height: 76px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.04);
        border: 1px solid rgba(15, 23, 42, 0.07);
      }
      html.dark .pe-boot-card {
        background: rgba(255, 255, 255, 0.03);
        border-color: rgba(255, 255, 255, 0.07);
      }
    </style>
  </head>
  <body class="bg-[#f6f7f9] dark:bg-[#0e1015] text-[#111318] dark:text-[#eef0f6] antialiased selection:bg-blue-500/20 selection:text-blue-700 dark:selection:text-blue-300">
    <div id="root">
      <div class="pe-boot-shell" aria-busy="true" aria-label="Loading Power Converter Studio">
        <div class="pe-boot-bar">
          <div>
            <div style="font-size:14px;font-weight:600;letter-spacing:-0.01em">Power Converter Studio</div>
            <div style="font-size:10px;opacity:0.6">Initializing physics &amp; magnetics solver…</div>
          </div>
          <div style="font-size:11px;font-family:monospace;opacity:0.7">Loading workspace…</div>
        </div>
        <div class="pe-boot-progress"></div>
        <div class="pe-boot-body">
          <div class="pe-boot-kpis">
            <div class="pe-boot-card"></div>
            <div class="pe-boot-card"></div>
            <div class="pe-boot-card"></div>
            <div class="pe-boot-card"></div>
            <div class="pe-boot-card"></div>
            <div class="pe-boot-card"></div>
          </div>
          <div class="pe-boot-card" style="height:340px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
